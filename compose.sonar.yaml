services:
  sonarqube:
    image: sonarqube:community
    container_name: student-management-sonarqube
    ports:
      - "9000:9000"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
    restart: unless-stopped

volumes:
  sonar_data:
  sonar_extensions:
  sonar_logs:
