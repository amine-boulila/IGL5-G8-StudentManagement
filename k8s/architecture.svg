<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title description">
  <title id="title">Student Management Kubernetes architecture</title>
  <desc id="description">Architecture of the Student Management application deployed on a Docker Desktop Kubernetes cluster with a Spring Boot application, MySQL, secret, persistent storage, and Docker Hub image.</desc>
  <defs>
    <linearGradient id="header" x1="0" x2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="app" x1="0" x2="1">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#eff6ff"/>
    </linearGradient>
    <linearGradient id="db" x1="0" x2="1">
      <stop offset="0" stop-color="#dcfce7"/>
      <stop offset="1" stop-color="#f0fdf4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity=".16"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#475569"/>
    </marker>
    <marker id="blueArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #ffffff; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #dbeafe; }
      .label { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .text { font: 400 15px Arial, sans-serif; fill: #334155; }
      .small { font: 400 13px Arial, sans-serif; fill: #475569; }
      .code { font: 600 14px Consolas, monospace; fill: #1e293b; }
      .cluster { fill: #f8fafc; stroke: #64748b; stroke-width: 2; stroke-dasharray: 10 8; }
      .box { stroke: #64748b; stroke-width: 1.5; }
      .arrow { stroke: #475569; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .blue-arrow { stroke: #2563eb; stroke-width: 2.5; fill: none; marker-end: url(#blueArrow); }
      .dashed { stroke-dasharray: 8 7; }
    </style>
  </defs>

  <rect width="1400" height="900" fill="#ffffff"/>
  <rect x="0" y="0" width="1400" height="90" fill="url(#header)"/>
  <text x="55" y="43" class="title">Student Management - Kubernetes Architecture</text>
  <text x="57" y="68" class="subtitle">Docker Desktop Kubernetes • namespace: student-management</text>

  <g filter="url(#shadow)">
    <rect x="55" y="145" width="225" height="120" rx="14" fill="#fff7ed" class="box"/>
    <text x="82" y="182" class="label">User / Browser</text>
    <text x="82" y="211" class="text">HTTP request</text>
    <text x="82" y="239" class="code">localhost:30089/student</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="350" y="145" width="250" height="120" rx="14" fill="#ede9fe" class="box"/>
    <text x="380" y="182" class="label">Kubernetes Service</text>
    <text x="380" y="211" class="text">student-management</text>
    <text x="380" y="239" class="code">NodePort: 30089</text>
  </g>

  <path d="M280 205 L350 205" class="arrow"/>
  <text x="285" y="190" class="small">external traffic</text>

  <rect x="635" y="120" width="710" height="715" rx="18" class="cluster"/>
  <rect x="660" y="135" width="280" height="38" rx="9" fill="#e2e8f0"/>
  <text x="680" y="161" class="label" font-size="17">Namespace: student-management</text>

  <g filter="url(#shadow)">
    <rect x="690" y="205" width="600" height="215" rx="14" fill="url(#app)" class="box"/>
    <text x="720" y="242" class="label">Application Deployment</text>
    <text x="720" y="270" class="text">student-management • replicas: 1</text>
    <rect x="720" y="292" width="540" height="96" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="745" y="320" class="label" font-size="16">Spring Boot Pod</text>
    <text x="745" y="347" class="code">maherkh/student-management:latest</text>
    <text x="745" y="372" class="code">containerPort: 8089</text>
  </g>

  <path d="M600 205 L690 205" class="blue-arrow"/>
  <text x="605" y="190" class="small">routes to application pod</text>

  <g filter="url(#shadow)">
    <rect x="690" y="470" width="600" height="245" rx="14" fill="url(#db)" class="box"/>
    <text x="720" y="507" class="label">MySQL Deployment</text>
    <text x="720" y="535" class="text">mysql • strategy: Recreate</text>
    <rect x="720" y="557" width="260" height="112" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
    <text x="745" y="587" class="label" font-size="16">MySQL Pod</text>
    <text x="745" y="614" class="code">mysql:8.0</text>
    <text x="745" y="641" class="code">database: studentdb</text>
    <rect x="1010" y="557" width="245" height="112" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
    <text x="1032" y="587" class="label" font-size="16">Persistent Storage</text>
    <text x="1032" y="614" class="code">PVC: mysql-data</text>
    <text x="1032" y="641" class="code">1 GiB /var/lib/mysql</text>
    <path d="M980 613 L1010 613" class="arrow"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="85" y="390" width="445" height="160" rx="14" fill="#fefce8" class="box"/>
    <text x="115" y="428" class="label">Kubernetes Secret</text>
    <text x="115" y="457" class="text">student-management-db</text>
    <text x="115" y="492" class="code">DB_PASSWORD</text>
    <text x="115" y="520" class="small">Injected into both application and MySQL pods</text>
  </g>

  <path d="M530 455 C610 455, 620 350, 720 350" class="blue-arrow dashed"/>
  <path d="M530 485 C615 485, 625 590, 720 590" class="blue-arrow dashed"/>

  <g filter="url(#shadow)">
    <rect x="85" y="640" width="445" height="125" rx="14" fill="#f1f5f9" class="box"/>
    <text x="115" y="680" class="label">Docker Hub</text>
    <text x="115" y="710" class="code">maherkh/student-management:latest</text>
    <text x="115" y="739" class="small">Image pulled by Kubernetes</text>
  </g>

  <path d="M530 700 C610 700, 620 335, 720 335" class="blue-arrow dashed"/>

  <path d="M990 420 L990 470" class="arrow"/>
  <text x="1010" y="453" class="small">JDBC</text>
  <text x="1010" y="470" class="code">mysql:3306</text>

  <text x="690" y="790" class="small">Application connection: jdbc:mysql://mysql:3306/studentdb</text>
  <text x="55" y="865" class="small">Deploy with: kubectl apply -f k8s/namespace.yaml, k8s/mysql.yaml, k8s/app.yaml</text>
</svg>
