apiVersion: v1
kind: ConfigMap
metadata:
  name: student-management-config
  namespace: student-management
data:
  SPRING_JPA_SHOW_SQL: "false"
  MANAGEMENT_SERVER_PORT: "9091"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus"
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-management
  namespace: student-management
spec:
  replicas: 1
  selector:
    matchLabels:
      app: student-management
  template:
    metadata:
      labels:
        app: student-management
    spec:
      containers:
        - name: app
          image: __IMAGE__
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8089
            - name: management
              containerPort: 9091
          envFrom:
            - configMapRef:
                name: student-management-config
          env:
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: MYSQL_DATABASE
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql:3306/$(MYSQL_DATABASE)?createDatabaseIfNotExist=true"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: MYSQL_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: MYSQL_PASSWORD
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: student-management-metrics
  namespace: student-management
spec:
  type: ClusterIP
  selector:
    app: student-management
  ports:
    - name: management
      port: 9091
      targetPort: management
---
apiVersion: v1
kind: Service
metadata:
  name: student-management
  namespace: student-management
spec:
  type: NodePort
  selector:
    app: student-management
  ports:
    - name: http
      port: 8089
      targetPort: http
      nodePort: 30089
