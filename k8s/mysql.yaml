# Base de donnees MySQL pour l'application
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "root1234"      # projet pedagogique : en production, ne jamais commiter un mot de passe
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  labels:
    app: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              value: studentdb
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-data
          emptyDir: {}                   # donnees perdues si le pod redemarre (suffisant pour la demo)
---
apiVersion: v1
kind: Service
metadata:
  name: mysql                            # nom DNS utilise par l'application : mysql:3306
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
