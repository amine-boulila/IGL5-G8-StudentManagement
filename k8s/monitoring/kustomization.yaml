apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: student-management

resources:
  - prometheus.yaml
  - grafana.yaml

configMapGenerator:
  - name: prometheus-config
    files:
      - prometheus.yml=prometheus/prometheus.k8s.yml
  - name: grafana-datasources
    files:
      - datasources.yml=grafana/provisioning/datasources/prometheus.yml
  - name: grafana-dashboard-provisioning
    files:
      - dashboards.yml=grafana/provisioning/dashboards/dashboards.yml
  - name: grafana-dashboard-student-management
    files:
      - student-management.json=grafana/dashboards/student-management.json

generatorOptions:
  disableNameSuffixHash: true
