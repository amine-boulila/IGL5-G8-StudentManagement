global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: student-management
    metrics_path: /actuator/prometheus
    scrape_interval: 10s
    static_configs:
      - targets: ["student-management-metrics.student-management.svc.cluster.local:9091"]
