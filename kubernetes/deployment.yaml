apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-management
  labels:
    app.kubernetes.io/name: student-management
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: student-management
  template:
    metadata:
      labels:
        app.kubernetes.io/name: student-management
    spec:
      containers:
        - name: student-management
          image: amineboulila/student-management:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8089
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
